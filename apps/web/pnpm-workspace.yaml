allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Forces patched versions of transitive dependencies Next.js/Prisma bundle
# internally (not something this project's own package.json controls
# directly) — see CLAUDE.md's security-audit section for the CVEs this
# addresses (sharp/libvips memory-safety issues, postcss path-traversal/
# XSS advisories).
overrides:
  sharp: '>=0.35.0'
  postcss: '>=8.5.18'
  find-my-way: '>=9.6.1'
  fast-uri: '>=3.1.5'
  valibot: '>=1.4.2'
