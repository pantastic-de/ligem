services:
  postgres:
    image: imresamu/postgis:17-3.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: c1u3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: c1db3
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c1u3 -d c1db3"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey and Meilisearch are not used by the app code yet (no client, no
  # REDIS_URL/MEILISEARCH_* reads). They sit behind the "extras" profile so
  # they don't start by default; `docker compose --profile extras up` starts
  # them once a feature actually needs them.
  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["extras"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data

  meilisearch:
    # Pinned: a major-version jump can't open an older data dir without a
    # dump/import, so never upgrade this via a blind `latest` pull.
    image: getmeili/meilisearch:v1.51.0
    profiles: ["extras"]
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data

  minio:
    # LEGACY, only for the one-time file migration: uploads now live as plain
    # files in the `media_data` volume (src/lib/storage.ts). This service
    # stays behind the "legacy" profile so existing installs can still start
    # it once and copy their files over with
    # scripts/migrate-minio-to-local.ts (see DEPLOYMENT.md), after which it,
    # its volume and the S3_* variables below can be removed. The
    # minio/minio image is no longer published anywhere, so this only works
    # where it is still cached.
    image: minio/minio:latest
    profiles: ["legacy"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  web:
    image: node:22-bookworm
    working_dir: /workspace/apps/web
    # `prisma migrate deploy` (applies whatever's pending, no-ops otherwise)
    # and `prisma db seed` (upsert-based — categories/attribute
    # groups/installation admin, see prisma/seed.ts) run on every container
    # start, mirroring docker-compose.prod.yml's own chain, so a fresh
    # `docker compose up` sets up the database automatically instead of
    # requiring a separate manual `pnpm db:migrate` step.
    command: sh -c "corepack enable && pnpm install && pnpm exec prisma migrate deploy && pnpm exec prisma db seed && pnpm dev"
    environment:
      DATABASE_URL: postgresql://c1u3:${POSTGRES_PASSWORD}@postgres:5432/c1db3
      REDIS_URL: redis://valkey:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
      # Where uploaded photos/videos are stored (the media_data volume below).
      MEDIA_DIR: /data/media
      # Only read by scripts/migrate-minio-to-local.ts (legacy MinIO access).
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET}
      # Explicit override for the app's own public base URL (used to build
      # every sign-in/callback/CSRF-cookie URL) — Auth.js's trustHost-based
      # detection from the Host/X-Forwarded-Host request headers turned out
      # too fragile behind a real reverse proxy in practice (reported
      # directly: a production deploy behind Apache/ISPConfig kept
      # generating http://localhost:3000/... URLs, breaking every sign-in,
      # even after Host-header forwarding was fixed). Empty/unset in dev,
      # where localhost detection is correct and desired; production sets
      # this to the real https://<domain> in its .env (see DEPLOYMENT.md).
      AUTH_URL: ${AUTH_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
    volumes:
      - .:/workspace
      # A named volume, not a folder inside the bind-mounted project: uploads
      # must survive `git reset --hard` deploys and shouldn't end up in the
      # repo or in a synced folder (iCloud).
      - media_data:/data/media
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  meili_data:
  minio_data:
  media_data:
