services:
  web:
    # `prisma generate` is listed explicitly here rather than relying only on
    # apps/web's own postinstall hook: `pnpm install --frozen-lockfile` can
    # decide node_modules already satisfies the lockfile and skip re-running
    # lifecycle scripts, leaving the generated client (gitignored, so it's
    # whatever was last generated on this server) out of sync with a
    # schema.prisma change that just arrived via `git reset --hard` — `next
    # build`'s type-check then fails on any field Prisma Client doesn't know
    # about yet, and the container crash-loops (restart: unless-stopped
    # keeps retrying the same broken build forever).
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm build && pnpm start"
    restart: unless-stopped
    # Production uses the server's native PostgreSQL/PostGIS install instead
    # of the Dockerized `postgres` service (that one is dev-only). DATABASE_URL
    # comes from the server's .env — see DEPLOYMENT.md — and must point at
    # `host.docker.internal` (not `postgres`), since there is no `postgres`
    # container to resolve that hostname against in production.
    #
    # Note: `postgres` is NOT removed from depends_on here — Compose merges
    # depends_on lists across -f files rather than replacing them, so it
    # would still auto-start regardless of what's listed in this override.
    # The `up` command must be run with `--no-deps` instead (see
    # DEPLOYMENT.md / scripts/deploy.sh) to actually keep it from starting.
    environment:
      DATABASE_URL: ${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
